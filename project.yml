name: MemoryMatch
options:
  bundleIdPrefix: com.powerplant
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    # Signing is per-SDK: simulators (the factory and CI) never sign, so no
    # agent or runner ever needs an Apple identity — while a developer's own
    # machine can produce device-installable builds from this same spec by
    # exporting DEVELOPMENT_TEAM before generating (see Scripts/generate.sh;
    # the credential lives in ~/.powerplant/env, never in this repository).
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]: "NO"
    CODE_SIGNING_ALLOWED[sdk=iphoneos*]: "YES"

targets:
  MemoryMatch:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: App
        optional: true
    resources:
      - path: Resources
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.powerplant.memorymatch
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"

  MemoryMatchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: MemoryMatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"

  MemoryMatchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: MemoryMatch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TEST_TARGET_NAME: MemoryMatch

schemes:
  MemoryMatch:
    build:
      targets:
        MemoryMatch: all
        MemoryMatchTests: [test]
        MemoryMatchUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - MemoryMatchTests
        - MemoryMatchUITests
